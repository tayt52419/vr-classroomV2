<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ห้องเรียนเสมือนจริง VR</title>
<style>
:root{--bg:#0b1220;--panel:rgba(255,255,255,.9);--text:#0b1a33;--muted:#44566f;--accent:#0e7490;--border:rgba(14,116,144,.4);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--panel:rgba(12,22,42,.85);--text:#e8f1ff;--muted:#9fb3d1;--accent:#22d3ee;--border:rgba(34,211,238,.4)}}
:root[data-theme="dark"]{--panel:rgba(12,22,42,.85);--text:#e8f1ff;--muted:#9fb3d1;--accent:#22d3ee;--border:rgba(34,211,238,.4)}
html,body{height:100%;margin:0;background:var(--bg);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.box{position:fixed;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:16px;backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.28);padding:12px 16px}
#hud{top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;max-width:min(92vw,420px)}
#hud h1{font-size:18px;margin:0 0 6px;color:var(--accent);letter-spacing:.2px}
#hud p{font-size:13px;margin:0;color:var(--muted);line-height:1.5}
#btns{top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;display:flex;gap:8px;padding:8px}
button{font:inherit;font-size:13px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{background:var(--border)}
#info{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:min(92vw,520px);display:none}
#info h2{margin:0 0 6px;font-size:17px;color:var(--accent)}
#info p{margin:0;font-size:14px;line-height:1.6}
#x{position:absolute;top:6px;right:8px;padding:2px 8px}
#err{inset:0;margin:auto;height:fit-content;width:min(90vw,360px);text-align:center}
</style></head><body>
<canvas id="c"></canvas>
<div class="box" id="hud"><h1>🏫 ห้องเรียนเสมือนจริง</h1>
<p>ลากเมาส์เพื่อมองรอบ • W A S D หรือปุ่มลูกศรเพื่อเดิน • Space กระโดด • E นั่ง/ลุก • Shift วิ่ง • Z โบกมือ • X เต้น • H ยกมือ • L ไฟ • N กลางวัน/คืน • ดับเบิลคลิกพื้นเพื่อเดินไป • คลิกวัตถุเพื่อดูข้อมูล</p></div>
<div class="box" id="btns"><button id="reset">รีเซ็ตตำแหน่ง</button><button id="lt">💡 ไฟ</button><button id="nt">🌙 กลางคืน</button><button id="vw">มุมมอง: บุคคลที่ 3</button><button id="tg">ซ่อน/แสดงป้าย</button></div>
<div class="box" id="info"><button id="x">✕</button><h2 id="it"></h2><p id="id"></p></div>
<div class="box" id="tip" hidden style="top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);font-size:14px"></div>
<div class="box" id="err" hidden>เบราว์เซอร์นี้ไม่รองรับ WebGL กรุณาลองเบราว์เซอร์อื่น</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var cv=document.getElementById('c'),renderer;
try{renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'low-power'});}
catch(e){document.getElementById('err').hidden=false;return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
renderer.setSize(innerWidth,innerHeight);
var scene=new THREE.Scene();scene.background=new THREE.Color(0x0b1220);
var camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,50);camera.layers.enable(1);
var hemi=new THREE.HemisphereLight(0xfff6e6,0xa8957c,1),lamps=[];scene.add(hemi);
var dl=new THREE.DirectionalLight(0xffe9c4,.5);dl.position.set(3,6,4);scene.add(dl);

var mats={};
function mat(c){return mats[c]||(mats[c]=new THREE.MeshLambertMaterial({color:c}));}
function box(w,h,d,c,x,y,z,p){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);(p||scene).add(m);return m;}
function basic(w,h,c,x,y,z,p){var m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),c.isTexture?new THREE.MeshBasicMaterial({map:c}):new THREE.MeshBasicMaterial({color:c}));m.position.set(x,y,z);(p||scene).add(m);return m;}
var objs=[];
function info(o,t,d){o.userData.info={t:t,d:d};objs.push(o);return o;}

/* room */
var room=new THREE.Mesh(new THREE.BoxGeometry(10,3.2,8),new THREE.MeshLambertMaterial({color:0xeef2f7,side:THREE.BackSide}));
room.position.y=1.6;scene.add(room);
var floor=new THREE.Mesh(new THREE.PlaneGeometry(10,8),new THREE.MeshLambertMaterial({map:tex(1024,820,function(g,W,H){var rows=16,rh=H/rows;for(var r=0;r<rows;r++){var x=-(r%2)*90;while(x<W){var w=180+Math.random()*60,l=46+Math.random()*10;g.fillStyle='hsl(28,'+(36+Math.random()*10)+'%,'+l+'%)';g.fillRect(x,r*rh,w,rh);g.strokeStyle='rgba(60,35,15,.35)';g.strokeRect(x,r*rh,w,rh);x+=w;}}})}));
floor.rotation.x=-Math.PI/2;floor.position.y=.01;scene.add(floor);

/* canvas texture helpers */
function tex(w,h,fn){var c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);return new THREE.CanvasTexture(c);}

function sign(text,x,y,z,w){w=w||1.6;
var t=tex(512,128,function(g,W,H){g.fillStyle='rgba(8,20,40,.88)';g.fillRect(0,0,W,H);g.strokeStyle='#22d3ee';g.lineWidth=6;g.strokeRect(3,3,W-6,H-6);g.fillStyle='#e8f1ff';g.font='600 44px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(text,W/2,H/2);});
var s=new THREE.Sprite(new THREE.SpriteMaterial({map:t}));s.scale.set(w,w/4,1);s.position.set(x,y,z);s.layers.set(1);signs.add(s);}

/* decor */
var shTex=tex(128,128,function(g){var r=g.createRadialGradient(64,64,4,64,64,62);r.addColorStop(0,'rgba(0,0,0,.35)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,128,128);});
function shade(w,d,x,z,p){var m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshBasicMaterial({map:shTex,transparent:true,depthWrite:false}));m.rotation.x=-Math.PI/2;m.position.set(x,.02,z);m.raycast=function(){};(p||scene).add(m);}
[[0,-3.99,10,.02],[0,3.99,10,.02],[-4.99,0,.02,8],[4.99,0,.02,8]].forEach(function(a){var w=a[2]>1?a[2]:.05,d=a[3]>1?a[3]:.05;box(a[2],.95,a[3],0x2c5f7c,a[0],.475,a[1]);box(w,.04,d,0xffffff,a[0],.97,a[1]);box(w,.12,d,0x1f2d3a,a[0],.06,a[1]);});
[-2.6,0,2.6].forEach(function(x){[-1.4,1.6].forEach(function(z){var l=basic(1.3,.5,0xffffff,x,3.19,z);l.rotation.x=Math.PI/2;l.raycast=function(){};lamps.push(l);});});
[[3.4,1.5,0x2e4a7d],[3.0,1.15,0x4a78b8]].forEach(function(a,i){var r=basic(a[0],a[1],a[2],0,.02+i*.004,-1.9);r.rotation.x=-Math.PI/2;r.raycast=function(){};});
[-2,0,2].forEach(function(z){[-.95,.95].forEach(function(o){box(.12,1.55,.3,0x3b6ea5,-4.9,1.75,z+o);});});
function plant(x,z){var g=new THREE.Group();scene.add(g);var p=new THREE.Mesh(new THREE.CylinderGeometry(.2,.15,.35,10),mat(0xb5651d));p.position.set(x,.175,z);g.add(p);var a=new THREE.Mesh(new THREE.IcosahedronGeometry(.34,0),mat(0x2e8b57));a.position.set(x,.72,z);g.add(a);var b=new THREE.Mesh(new THREE.IcosahedronGeometry(.22,0),mat(0x3cb371));b.position.set(x+.12,1.05,z-.05);g.add(b);shade(.9,.9,x,z,g);info(g,'ต้นไม้ประดับ','ช่วยให้บรรยากาศในห้องเรียนสดชื่นและผ่อนคลาย ต้นไม้ในร่มยังช่วยฟอกอากาศเล็กน้อยด้วย');}
plant(-4.3,-3.4);plant(-4.3,3.4);plant(4.3,3.5);sign('ต้นไม้',-4.3,1.5,-3.4,.9);
function poster(x,y,z,ry,t,d,draw,label){var g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=ry;scene.add(g);box(1.1,1.5,.03,0x1f2d3a,0,0,0,g);basic(1,1.4,tex(400,560,draw),0,0,.02,g);info(g,t,d);sign(label,x,y+1.0,z+(ry?-.2:.2),1.2);}

poster(-2.2,1.9,3.95,Math.PI,'โปสเตอร์สร้างแรงบันดาลใจ','ข้อความให้กำลังใจติดไว้ท้ายห้อง ช่วยสร้างบรรยากาศการเรียนรู้เชิงบวก',function(g,W,H){var r=g.createLinearGradient(0,0,0,H);r.addColorStop(0,'#0ea5e9');r.addColorStop(1,'#7c3aed');g.fillStyle=r;g.fillRect(0,0,W,H);g.fillStyle='#fff';g.textAlign='center';g.font='700 64px sans-serif';g.fillText('ความรู้',W/2,230);g.fillText('คือพลัง',W/2,310);g.font='500 30px sans-serif';g.fillText('เรียนรู้ทุกวัน',W/2,420);},'โปสเตอร์');

/* whiteboard (front wall) */
var wb=new THREE.Group();scene.add(wb);
box(4.2,1.5,.06,0xb8c2cc,0,1.7,-3.97,wb);box(3.6,.06,.14,0x8a949f,0,.96,-3.9,wb);box(.14,.03,.03,0xc0392b,-.6,1.0,-3.88,wb);box(.14,.03,.03,0x1d4ed8,-.35,1.0,-3.88,wb);
basic(4,1.3,tex(1024,330,function(g,W,H){g.fillStyle='#fff';g.fillRect(0,0,W,H);g.fillStyle='#0e7490';g.font='700 64px sans-serif';g.textAlign='center';g.fillText('ยินดีต้อนรับสู่ห้องเรียน',W/2,120);g.fillStyle='#334155';g.font='500 42px sans-serif';g.fillText('วิชา เทคโนโลยีสารสนเทศ',W/2,200);g.fillText('วันนี้เรียนเรื่อง: 3D และ VR',W/2,265);}),0,1.7,-3.93,wb);
info(wb,'ไวต์บอร์ด','ใช้เขียนอธิบายเนื้อหาหน้าชั้นเรียน ครูใช้ปากกาไวต์บอร์ดเขียนและลบออกได้ง่าย ควรนั่งให้มองเห็นกระดานชัดเจน');
sign('ไวต์บอร์ด',0,2.75,-3.8);

/* clock */
var ck=new THREE.Group();ck.position.set(3.6,2.5,-3.95);scene.add(ck);
var cd=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.04,20),mat(0xffffff));cd.rotation.x=Math.PI/2;ck.add(cd);
var hmin=new THREE.Group(),hhr=new THREE.Group();hmin.position.z=.03;hhr.position.z=.03;ck.add(hmin);ck.add(hhr);box(.02,.2,.01,0x111111,0,.1,0,hmin);box(.025,.13,.01,0x111111,0,.065,0,hhr);
info(ck,'นาฬิกาแขวนผนัง','ช่วยให้ครูและนักเรียนบริหารเวลาเรียนได้ตรงเวลา ตั้งไว้ฝั่งหน้าห้องเพื่อให้มองเห็นง่าย');
sign('นาฬิกา',3.6,3.0,-3.8,1.1);

/* teacher desk + computer */
var td=new THREE.Group();scene.add(td);
shade(2.7,1.4,0,-2.8,td);box(2.1,.06,.85,0x8d5f36,0,.75,-2.8,td);box(.06,.72,.8,0x6f4a2a,-1,.36,-2.8,td);box(.06,.72,.8,0x6f4a2a,1,.36,-2.8,td);
info(td,'โต๊ะครู','โต๊ะสำหรับวางเอกสาร สื่อการสอน และคอมพิวเตอร์ของครู อยู่หน้าห้องเพื่อดูแลนักเรียนได้ทั่วถึง');
sign('โต๊ะครู',-.8,1.5,-2.8,1.2);
var pc=new THREE.Group();pc.position.set(.3,.78,-2.85);scene.add(pc);
box(.22,.02,.16,0x222a35,0,0,0,pc);box(.04,.16,.04,0x222a35,0,.09,0,pc);box(.55,.34,.03,0x222a35,0,.34,0,pc);
basic(.5,.29,0x1e5a8a,0,.34,.02,pc);box(.4,.02,.14,0x333b47,0,.01,.3,pc);
info(pc,'คอมพิวเตอร์ของครู','ใช้เปิดสไลด์ วิดีโอ และสื่อการสอน เชื่อมต่อกับโปรเจกเตอร์เพื่อฉายภาพขึ้นหน้าห้อง');
sign('คอมพิวเตอร์',.3,1.55,-2.85,1.3);

/* projector */
var pj=new THREE.Group();pj.position.set(0,3.0,.5);scene.add(pj);
box(.5,.16,.38,0x2b3440,0,0,0,pj);box(.05,.2,.05,0x555e6b,0,.17,0,pj);
var ln=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.08,12),mat(0x111111));ln.rotation.x=Math.PI/2;ln.position.set(0,0,-.22);pj.add(ln);
info(pj,'โปรเจกเตอร์','ฉายภาพจากคอมพิวเตอร์ขึ้นจอหรือผนังหน้าห้อง ติดตั้งที่เพดานเพื่อไม่กีดขวางทางเดิน');
sign('โปรเจกเตอร์',0,2.6,.5,1.4);

/* student desks */
var blocks=[{x:0,z:-2.8,hw:1.1,hd:.5},{x:4.7,z:-2.3,hw:.35,hd:.9},{x:-4.3,z:-3.4,hw:.25,hd:.25},{x:-4.3,z:3.4,hw:.25,hd:.25},{x:4.3,z:3.5,hw:.25,hd:.25}];var chairs=[];
function desk(x,z){var g=new THREE.Group();scene.add(g);
box(1.2,.05,.6,0xd9b98a,x,.72,z,g);box(.05,.7,.5,0x777f8a,x-.55,.36,z,g);box(.05,.7,.5,0x777f8a,x+.55,.36,z,g);
var cc=[0x2f6f9f,0xe07a5f,0x3d9970][Math.abs(Math.round(x*3+z*5))%3];chairs.push({x:x,z:z+.62});shade(1.7,1.9,x,z+.35,g);box(.42,.05,.42,cc,x,.43,z+.62,g);box(.42,.4,.05,cc,x,.68,z+.83,g);box(.05,.4,.05,0x777f8a,x,.2,z+.62,g);
info(g,'โต๊ะ–เก้าอี้นักเรียน','ที่นั่งสำหรับเรียนและจดบันทึก ควรนั่งหลังตรงและปรับระยะให้สบายเพื่อไม่ให้ปวดหลัง');
blocks.push({x:x,z:z+.3,hw:.75,hd:.8});}
[-2.6,0,2.6].forEach(function(x){[-.8,.7,2.2].forEach(function(z){desk(x,z);});});
sign('โต๊ะนักเรียน',0,1.5,-.8,1.5);

/* bookshelf (right wall) */
var bs=new THREE.Group();scene.add(bs);
box(.45,2,1.7,0x7a5230,4.72,1,-2.3,bs);
[.5,1.1,1.7].forEach(function(y,i){box(.5,.03,1.65,0x5f3f22,4.7,y,-2.3,bs);
for(var k=0;k<6;k++)box(.25,.3,.18,[0xc0392b,0x2980b9,0x27ae60,0xf1c40f,0x8e44ad][(i+k)%5],4.65,y+.17,-2.3-.65+k*.26,bs);});
info(bs,'ตู้หนังสือ','เก็บหนังสือเรียน คู่มือ และสื่อการเรียนรู้ นักเรียนยืมอ่านได้ตามกติกาของห้อง');
sign('ตู้หนังสือ',4.5,2.45,-2.3,1.3);

/* windows (left wall) */
var wd=new THREE.Group();scene.add(wd);
[-2,0,2].forEach(function(z){box(.06,1.3,1.7,0xffffff,-4.97,1.7,z,wd);var g=basic(1.5,1.1,0x9bd6ff,-4.93,1.7,z,wd);g.rotation.y=Math.PI/2;});
info(wd,'หน้าต่าง','รับแสงธรรมชาติและช่วยระบายอากาศ ช่วยให้ห้องสว่างโดยประหยัดไฟฟ้า');
sign('หน้าต่าง',-4.8,2.7,0,1.2);

/* door (right wall) */
var dr=new THREE.Group();scene.add(dr);
var doorOpen=false,doorA=0;dr.position.set(4.97,0,3.1);var hall=basic(1,2.2,0xdbe8f5,4.985,1.1,2.6);hall.rotation.y=-Math.PI/2;hall.raycast=function(){};box(.06,2.2,1,0x8b5a2b,0,1.1,-.5,dr);box(.1,.08,.12,0xd4af37,-.07,1.05,-.9,dr);dr.userData.act=function(){doorOpen=!doorOpen;};
info(dr,'ประตูห้องเรียน','ทางเข้า–ออกหลักของห้อง ควรเปิดทางเดินหน้าประตูให้โล่งเพื่อความปลอดภัย');
sign('ประตู',4.7,2.45,2.6,1);

/* air conditioner (back wall) */
var ac=new THREE.Group();scene.add(ac);
box(1.3,.36,.25,0xf5f7fa,2,2.65,3.87,ac);box(1.1,.04,.02,0x9aa7b8,2,2.55,3.74,ac);
info(ac,'เครื่องปรับอากาศ','ควบคุมอุณหภูมิในห้องให้เหมาะสมต่อการเรียน ตั้งอุณหภูมิประมาณ 25–26 องศาเซลเซียสเพื่อประหยัดไฟ');
sign('แอร์',2,3.05,3.7,.9);

/* teacher NPC */
var T=new THREE.Group();scene.add(T);
function limb(w,h,d,c,x,y,p){var v=new THREE.Group();v.position.set(x,y,0);p.add(v);box(w,h,d,c,0,-h/2,0,v);return v;}
var legL=limb(.13,.72,.15,0x2b3a55,-.1,.76,T),legR=limb(.13,.72,.15,0x2b3a55,.1,.76,T);
box(.46,.58,.26,0x2e86c1,0,1.05,0,T);box(.07,.3,.02,0xc0392b,0,1.1,.14,T);
var armL=limb(.11,.55,.13,0x2e86c1,-.29,1.31,T),armR=limb(.11,.55,.13,0x2e86c1,.29,1.31,T);
box(.1,.1,.12,0xf1c27d,0,-.58,0,armL);box(.1,.1,.12,0xf1c27d,0,-.58,0,armR);
